name: Backend

on:
  push:
    branches: [develop, main]
    paths: &backend-paths
      - 'frontend/**'
      - 'scripts/build-frontend.sh'
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'Directory.Build.props'
      - 'global.json'
      - 'MoongateAdmin.slnx*'
      - '.editorconfig'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [develop, main]
    paths: *backend-paths

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run format:check
      - run: npm --prefix frontend test
      - run: scripts/build-frontend.sh
      - run: npm --prefix frontend exec playwright -- install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-evidence
          path: frontend/test-results
          retention-days: 7
      - run: dotnet restore MoongateAdmin.slnx --locked-mode
      - run: dotnet build MoongateAdmin.slnx -c Release --no-restore
      - run: dotnet test MoongateAdmin.slnx -c Release --no-build --logger trx
      - run: dotnet format MoongateAdmin.slnx --verify-no-changes --no-restore
      - name: Verify published UI
        run: |
          dotnet publish src/Moongate.Admin.Api -c Release --no-restore -o /tmp/moongate-admin-publish
          test -s /tmp/moongate-admin-publish/wwwroot/frontend/index.html
          test -n "$(find /tmp/moongate-admin-publish/wwwroot/frontend/assets -name '*.js' -print -quit)"
      - run: git diff --check
      - name: Swagger UI script smoke test
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/Moongate.Admin.Api -c Release --no-build --no-launch-profile --urls http://127.0.0.1:17080 > /tmp/moongate-swagger.log 2>&1 &
          task_swagger_pid=$!
          trap 'kill "$task_swagger_pid"' EXIT
          node tests/Browser/swagger-ui-smoke.cjs
