name: Backend

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore MoongateAdmin.slnx --locked-mode
      - run: dotnet build MoongateAdmin.slnx -c Release --no-restore
      - run: dotnet test MoongateAdmin.slnx -c Release --no-build --logger trx
      - run: dotnet format MoongateAdmin.slnx --verify-no-changes --no-restore
      - run: git diff --check
