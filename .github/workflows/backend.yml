name: Backend

on:
  push:
    branches: [develop, main]
    paths: &backend-paths
      - 'src/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - 'Directory.Build.props'
      - 'global.json'
      - 'MoongateAdmin.slnx*'
      - '.editorconfig'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [develop, main]
    paths: *backend-paths

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore MoongateAdmin.slnx --locked-mode
      - run: dotnet build MoongateAdmin.slnx -c Release --no-restore
      - run: dotnet test MoongateAdmin.slnx -c Release --no-build --logger trx
      - run: dotnet format MoongateAdmin.slnx --verify-no-changes --no-restore
      - run: git diff --check
      - name: Swagger UI script smoke test
        shell: bash
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run --project src/Moongate.Admin.Api -c Release --no-build --no-launch-profile --urls http://127.0.0.1:17080 > /tmp/moongate-swagger.log 2>&1 &
          task_swagger_pid=$!
          trap 'kill "$task_swagger_pid"' EXIT
          node tests/Browser/swagger-ui-smoke.cjs
